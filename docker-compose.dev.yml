version: '3.8'

# ============================================================
# Daka Technical Assessment — Docker Compose (Desarrollo)
# Stack: NestJS + Next.js 14 + PostgreSQL
# ============================================================

services:

  db:
    image: postgres:17-alpine
    container_name: nest-next-db
    environment:
      POSTGRES_USER:     ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB:       ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - daka_network

  # ──────────────────────────────────────────────────────────
  # Backend — NestJS
  # Estado: ✅ Configurado
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: nest-next-backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:          development
      DATABASE_HOST:     db
      DATABASE_PORT:     ${DATABASE_PORT:-5432}
      DATABASE_USER:     ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME:     ${DATABASE_NAME}
      JWT_SECRET:        ${JWT_SECRET}
      PORT:              3000
      FRONTEND_URL:      http://localhost:3001
    depends_on:
      db:
        condition: service_healthy
    networks:
      - daka_network

  # ──────────────────────────────────────────────────────────
  # Frontend — Next.js 14
  # Estado: ✅ Configurado
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: nest-next-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_WS_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - daka_network

volumes:
  postgres_data:

networks:
  daka_network:
    driver: bridge