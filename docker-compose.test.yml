version: '3.8'

services:
  # 🗄️ Base de Datos PostgreSQL (Producción / Test)
  postgres:
    image: postgres:17-alpine
    container_name: dakatest_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dakatest_db}
    networks:
      - internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dakatest_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ⚙️ Backend NestJS (Target Production)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: dakatest_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_NAME: ${POSTGRES_DB:-dakatest_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_daka}
      FRONTEND_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal_network
      - public_network

  # 🎨 Frontend Next.js (Target Runner / Production)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: dakatest_frontend_prod
    restart: always
    ports:
      - "80:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - public_network

networks:
  internal_network:
    driver: bridge
    internal: true
  public_network:
    driver: bridge
